name: Continuous Integration

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit - PHP ${{ matrix.php-version }} (${{ matrix.os }}, ${{ matrix.dependencies }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP 8.1 - highest and lowest
          - php-version: "8.1"
            os: ubuntu-latest
            dependencies: highest
          - php-version: "8.1"
            os: ubuntu-latest
            dependencies: lowest
          # PHP 8.2 - highest and lowest
          - php-version: "8.2"
            os: ubuntu-latest
            dependencies: highest
          - php-version: "8.2"
            os: ubuntu-latest
            dependencies: lowest
          # PHP 8.3 - highest and lowest
          - php-version: "8.3"
            os: ubuntu-latest
            dependencies: highest
          - php-version: "8.3"
            os: ubuntu-latest
            dependencies: lowest
          # PHP 8.4 - highest only (lowest would install aura/sql 5.x which doesn't work)
          - php-version: "8.4"
            os: ubuntu-latest
            dependencies: highest
          - php-version: "8.4"
            os: windows-latest
            dependencies: highest
          # PHP 8.5 - highest only (lowest would install aura/sql 5.x which doesn't work)
          - php-version: "8.5"
            os: ubuntu-latest
            dependencies: highest
            experimental: true

    steps:
      - name: Disable autocrlf on Windows
        if: contains(matrix.os, 'windows')
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          ini-values: |
            zend.assertions=1
            memory_limit=512M
          extensions: fileinfo,pdo,pdo_mysql,pdo_sqlite

      - name: Get composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json', '**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Set platform requirements
        if: matrix.dependencies == 'lowest'
        shell: bash
        run: composer config platform.php ${{ matrix.php-version }}

      - name: Install dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        shell: bash
        run: composer update --prefer-lowest --no-interaction --no-progress --prefer-dist

      - name: Install dependencies (highest)
        if: matrix.dependencies == 'highest'
        shell: bash
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run test suite
        shell: bash
        run: vendor/bin/phpunit --coverage-clover=coverage.xml
        env:
          XDEBUG_MODE: coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
